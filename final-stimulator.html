<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1c2333;--m:#667;--b:#dde2ee;--ac:#3b6cf6;--ok:#16a34a;--no:#dc2626;--wa:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--c:#1a2132;--t:#e8ecf5;--m:#95a0b8;--b:#2c364d}}
:root[data-theme="dark"]{--bg:#0f1420;--c:#1a2132;--t:#e8ecf5;--m:#95a0b8;--b:#2c364d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding:16px}
.w{max-width:1050px;margin:auto}h1{margin:0;font-size:26px;text-align:center}.sub{text-align:center;color:var(--m);margin:4px 0 16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px}h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--m)}
#stage{position:relative;display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:12px;margin-bottom:12px}
.ctr{text-align:center}.big{font-size:44px}.st{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:600;font-size:13px;margin:6px 0 10px;color:#fff}
.Ready{background:var(--ok)}.Waiting{background:var(--no)}.Producing,.Consuming{background:var(--wa)}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.slot{width:84px;height:70px;border:2px dashed var(--b);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--m);transition:.3s}
.slot.on{border:2px solid var(--ac);background:rgba(59,108,246,.12);color:var(--t);font-weight:600}.slot .e{font-size:26px}
button{font:inherit;padding:8px 14px;border:1px solid var(--b);background:var(--ac);color:#fff;border-radius:8px;cursor:pointer;margin:3px}
button.g{background:var(--c);color:var(--t)}button:disabled{opacity:.45;cursor:not-allowed}.why{display:block;font-size:12px;color:var(--no);min-height:16px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}.sem{text-align:center}.sem .v{font-size:38px;font-weight:700;font-family:monospace}.sem small{color:var(--m)}
.msg{padding:10px;border-radius:8px;background:rgba(59,108,246,.1);margin-bottom:12px;min-height:40px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}#log{height:250px;overflow:auto;font:12px monospace}#log div{padding:1px 0;border-bottom:1px solid var(--b)}
.fly{position:absolute;font-size:28px;transition:left .7s ease,top .7s ease;z-index:9;pointer-events:none}
label{font-size:13px;display:block;margin:6px 0}input[type=range]{vertical-align:middle}
.stat{display:flex;justify-content:space-between;padding:3px 0}code{background:var(--bg);padding:2px 6px;border-radius:4px}
@media(max-width:720px){#stage,.row,.two{grid-template-columns:1fr}}

/* --- Luxury skin (integration): overrides colour variables only; layout/behaviour untouched --- */
:root[data-theme="dark"]{--bg:#0b1220;--c:#151c2b;--t:#f2f4f8;--m:#9aa5b8;--b:#27324a;--ac:#4f6fae;--ok:#3f9d6b;--no:#c0504d;--wa:#c58a2e}
button:focus-visible,input:focus-visible{outline:2px solid #9db4e6;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.slot,.fly{transition:none!important}}
</style></head><body><div class="w">
<h1>Producer–Consumer Problem Simulator</h1><div class="sub">Car Factory → Parking Buffer → Customer</div>
<div id="stage">
 <div class="card ctr" id="fac"><h2>🏭 Car Factory</h2><div class="big">🏭</div><b>Producer</b><br><span class="st" id="ps"></span><br>
  <button id="bp">Produce Car</button><button class="g" id="ba">Auto Produce</button><span class="why" id="pw"></span></div>
 <div class="card ctr"><h2>🅿️ Parking Area (Shared Buffer)</h2><div class="slots" id="slots"></div>
  <div style="margin-top:10px">Capacity: <input id="cap" type="number" min="1" max="10" value="3" style="width:56px;padding:4px"></div>
  <div style="margin-top:8px" id="mx"></div></div>
 <div class="card ctr" id="cus"><h2>👤 Customer / Dealer</h2><div class="big">👤</div><b>Consumer</b><br><span class="st" id="cs"></span><br>
  <button id="bc">Consume Car</button><button class="g" id="bd">Auto Consume</button><span class="why" id="cw"></span></div>
</div>
<div class="msg" id="msg"></div>
<div class="card" style="margin-bottom:12px"><h2>Controls</h2>
 <button id="start">▶ Start Simulation</button><button class="g" id="pause">⏸ Pause</button><button class="g" id="reset">↻ Reset</button>
 <button id="next">▶ Next Step</button> <label style="display:inline-block;margin-left:8px"><input type="checkbox" id="stepm"> Step-by-step mode (Produce/Consume wait for Next Step)</label>
 <label>Producer interval: <input type="range" id="pr" min="0.5" max="5" step="0.5" value="2"> <b id="prv">2</b>s</label>
 <label>Consumer interval: <input type="range" id="cr" min="0.5" max="5" step="0.5" value="3"> <b id="crv">3</b>s</label></div>
<h2 style="margin-left:4px">Synchronization / Semaphore Status</h2>
<div class="row"><div class="card sem"><h2>empty</h2><div class="v" id="ve"></div><small>Number of empty parking slots</small></div>
<div class="card sem"><h2>full</h2><div class="v" id="vf"></div><small>Number of cars currently in parking</small></div>
<div class="card sem"><h2>mutex</h2><div class="v" id="vm"></div><small>Controls mutual exclusion</small><div id="mxo"></div></div></div>
<div class="two"><div class="card"><h2>Event Log</h2><div id="log"></div></div>
<div class="card"><h2>Statistics</h2><div id="stats"></div><h2 style="margin-top:14px">Formulas</h2>
<div><code>empty = Capacity − Cars in Buffer</code><br><br><code>full = Cars in Buffer</code><br><br><code>mutex = 1 free / 0 locked</code><br><br><b id="inv"></b></div></div></div>
<div class="card"><h2>How Producer–Consumer Works</h2>
<p><b>Producer:</b> The Car Factory produces cars and places them into the shared parking buffer.</p>
<p><b>Buffer:</b> The Parking Area is a limited shared resource where produced cars wait before being consumed.</p>
<p><b>Consumer:</b> The Customer/Dealer removes cars from the parking buffer.</p>
<p><b>Semaphore:</b> Semaphores control the number of empty and occupied parking slots and prevent simultaneous unsafe access.</p>
<p><code>Producer: wait(empty) → wait(mutex) → add car → signal(mutex) → signal(full)</code><br><br>
<code>Consumer: wait(full) → wait(mutex) → remove car → signal(mutex) → signal(empty)</code></p></div>
</div>

  --text-dim: #8b97a8;
  --text-faint: #5b6879;

  --producer: #4c8dff;
  --producer-soft: rgba(76, 141, 255, 0.12);
  --buffer: #f2b84b;
  --buffer-soft: rgba(242, 184, 75, 0.12);
  --consumer: #34c77b;
  --consumer-soft: rgba(52, 199, 123, 0.12);
  --waiting: #ff5d5d;
  --waiting-soft: rgba(255, 93, 93, 0.14);

  --radius: 10px;
  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(76, 141, 255, 0.06), transparent 45%),
    radial-gradient(circle at 85% 20%, rgba(52, 199, 123, 0.05), transparent 40%);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
}

#root {
  max-width: 1240px;
  margin: 0 auto;
  padding: 28px 20px 64px;
}

button {
  font-family: var(--font-ui);
  cursor: pointer;
  border: none;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

/* ---------- Header ---------- */

.app-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  padding-bottom: 22px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.app-header__title {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
}

.app-header__title span {
  color: var(--buffer);
}

.app-header__subtitle {
  color: var(--text-dim);
  font-size: 14.5px;
  margin: 0;
  max-width: 520px;
  line-height: 1.5;
}

.sync-vars {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.sync-vars__item {
  font-family: var(--font-mono);
  font-size: 12.5px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  min-width: 130px;
}

.sync-vars__item b {
  color: var(--text);
  display: block;
  font-size: 15px;
}

.sync-vars__item span {
  color: var(--text-faint);
}

.sync-vars__item.empty b { color: var(--consumer); }
.sync-vars__item.full b { color: var(--buffer); }
.sync-vars__item.mutex b { color: var(--producer); }

/* ---------- Controls bar ---------- */

.controls-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 24px;
}

.controls-bar__buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 600;
  transition: transform 0.12s ease, filter 0.12s ease;
}

.btn:active:not(:disabled) {
  transform: scale(0.97);
}

.btn-start {
  background: var(--consumer);
  color: #06170f;
}

.btn-pause {
  background: var(--buffer);
  color: #241a04;
}

.btn-reset {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
}

.btn-reset:hover:not(:disabled) {
  color: var(--text);
  border-color: var(--text-faint);
}

.speed-control {
  display: flex;
  align-items: center;
  gap: 10px;
}

.speed-control__label {
  font-size: 12.5px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.speed-control__options {
  display: flex;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}

.speed-option {
  background: transparent;
  color: var(--text-dim);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 600;
}

.speed-option.active {
  background: var(--producer-soft);
  color: var(--producer);
}

.run-status {
  font-family: var(--font-mono);
  font-size: 12.5px;
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  color: var(--text-dim);
}

.run-status.running {
  color: var(--consumer);
  border-color: rgba(52, 199, 123, 0.35);
  background: var(--consumer-soft);
}

.run-status.paused {
  color: var(--buffer);
  border-color: rgba(242, 184, 75, 0.35);
  background: var(--buffer-soft);
}

/* ---------- Main pipeline layout ---------- */

.pipeline {
  display: grid;
  grid-template-columns: 1fr 1.3fr 1fr;
  gap: 18px;
  align-items: start;
  margin-bottom: 22px;
}

@media (max-width: 880px) {
  .pipeline {
    grid-template-columns: 1fr;
  }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}

.panel__title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 0 0 14px;
}

.panel__title .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* ---------- Producers ---------- */

.producer-card {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  transition: border-color 0.2s ease;
}

.producer-card:last-child {
  margin-bottom: 0;
}

.producer-card.active {
  border-color: var(--producer);
}

.producer-card__name {
  font-weight: 600;
  font-size: 14px;
}

.producer-card__meta {
  font-size: 11.5px;
  color: var(--text-faint);
  margin-top: 2px;
}

.producer-card__btn {
  background: var(--producer-soft);
  color: var(--producer);
  padding: 7px 12px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
}

.producer-card__btn:hover:not(:disabled) {
  filter: brightness(1.2);
}

.waiting-flag {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--waiting);
  background: var(--waiting-soft);
  padding: 3px 8px;
  border-radius: 6px;
  display: inline-block;
  margin-top: 6px;
  animation: flicker 1.4s ease-in-out infinite;
}

@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

/* ---------- Queue / buffer ---------- */

.queue-count {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.queue-count b {
  color: var(--buffer);
  font-size: 15px;
}

.queue-track {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.queue-slot {
  aspect-ratio: 1 / 1.05;
  border-radius: 8px;
  border: 1.5px dashed var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6px 4px;
  font-family: var(--font-mono);
}

.queue-slot.empty span {
  color: var(--text-faint);
  font-size: 11px;
}

.queue-slot.filled {
  border-style: solid;
  border-color: var(--buffer);
  background: var(--buffer-soft);
  animation: pop-in 0.25s ease-out;
}

@keyframes pop-in {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.queue-slot__id {
  font-weight: 700;
  font-size: 12.5px;
  color: var(--buffer);
}

.queue-slot__producer {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 3px;
}

.progress-track {
  height: 6px;
  border-radius: 4px;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--producer), var(--buffer));
  transition: width 0.3s ease;
}

.queue-flash {
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 7px;
  background: var(--waiting-soft);
  color: var(--waiting);
  text-align: center;
}

/* ---------- Printer ---------- */

.printer-visual {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 14px 8px 18px;
}

.printer-icon {
  font-size: 40px;
  margin-bottom: 10px;
  transition: transform 0.2s ease;
}

.printer-icon.printing {
  animation: chug 0.6s ease-in-out infinite;
}

@keyframes chug {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

.printer-status-badge {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 20px;
  margin-bottom: 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.printer-status-badge.ready {
  color: var(--consumer);
  background: var(--consumer-soft);
}

.printer-status-badge.printing {
  color: var(--buffer);
  background: var(--buffer-soft);
}

.printer-status-badge.waiting {
  color: var(--waiting);
  background: var(--waiting-soft);
}

.printer-current-job {
  font-family: var(--font-mono);
  font-size: 13px;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 14px;
  width: 100%;
}

.printer-current-job b {
  color: var(--buffer);
  display: block;
  font-size: 14px;
}

.btn-print {
  background: var(--consumer-soft);
  color: var(--consumer);
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 13.5px;
  width: 100%;
}

.btn-print:hover:not(:disabled) {
  filter: brightness(1.15);
}

/* ---------- Completed jobs ---------- */

.section-panel {
  margin-bottom: 20px;
}

.completed-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  max-height: 160px;
  overflow-y: auto;
}

.completed-chip {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--consumer-soft);
  color: var(--consumer);
  border: 1px solid rgba(52, 199, 123, 0.3);
  border-radius: 20px;
  padding: 6px 12px;
}

.completed-chip span {
  color: var(--text-dim);
}

.empty-note {
  color: var(--text-faint);
  font-size: 13px;
  font-style: italic;
}

/* ---------- Event log ---------- */

.event-log {
  max-height: 220px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.event-log__row {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--text-dim);
  padding: 6px 10px;
  border-radius: 6px;
  background: var(--panel-alt);
  border-left: 3px solid var(--border);
}

.event-log__row.type-produce { border-left-color: var(--producer); }
.event-log__row.type-consume { border-left-color: var(--consumer); }
.event-log__row.type-wait { border-left-color: var(--waiting); }

.event-log__row time {
  color: var(--text-faint);
  margin-right: 8px;
}

/* ---------- Explanation ---------- */

.explanation {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: hidden;
}

.explanation__toggle {
  width: 100%;
  background: transparent;
  color: var(--text);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14.5px;
  font-weight: 700;
}

.explanation__chevron {
  transition: transform 0.2s ease;
  color: var(--text-dim);
}

.explanation__chevron.open {
  transform: rotate(180deg);
}

.explanation__body {
  padding: 0 18px 20px;
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.65;
}

.explanation__body h4 {
  color: var(--text);
  font-size: 14.5px;
  margin: 16px 0 6px;
}

.explanation__body h4:first-child {
  margin-top: 0;
}

.explanation__body code {
  font-family: var(--font-mono);
  background: var(--panel-alt);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 4px;
  color: var(--buffer);
  font-size: 13px;
}

"><\/label><label>Max R2<input id=\"c2\" type=\"number\" min=\"0\" value=\"1\"><\/label>\n<button onclick=\"addCust()\">Add order<\/button><\/div><\/details><\/div>\n\n<div class=\"card\"><h3>Workflow status<\/h3><div class=\"g g5\" id=\"stat\"><\/div><\/div>\n<div class=\"card\"><h3>Order tracker<\/h3><div class=\"wrap\"><table id=\"trk\"><\/table><\/div><\/div>\n<div class=\"card\"><h3>Producer–Consumer · bounded order queue <span id=\"capp\" class=\"pill in\"><\/span><\/h3><div class=\"g g3\" id=\"pc\"><\/div><div class=\"m\" id=\"inv\" style=\"margin-top:8px\"><\/div><\/div>\n<div class=\"card\"><h3>CPU scheduling <span id=\"algp\" class=\"pill in\"><\/span><\/h3><div class=\"g g3\" id=\"cpu\"><\/div><div class=\"sd\" id=\"dm\"><\/div>\n<div class=\"m\">Gantt chart (latest 60 ticks)<\/div><div class=\"gt\" id=\"gt\"><\/div><div class=\"m\" id=\"gl\"><\/div>\n<div class=\"m\" style=\"margin-top:8px\">Completed orders — AT = admission tick; TAT = CT − AT + 1; WT = TAT − burst; RT = first run − AT<\/div><div class=\"wrap\"><table id=\"met\"><\/table><\/div><\/div>\n<div class=\"card\"><h3>Banker's algorithm · resource safety <span id=\"bs\" class=\"pill\"><\/span><\/h3><div class=\"g g3\" id=\"res\"><\/div><div class=\"wrap\" style=\"margin-top:10px\"><table id=\"alloc\"><\/table><\/div><div class=\"m\" id=\"seq\" style=\"margin:8px 0\"><\/div>\n<div class=\"m\">Request decisions (each order asks ½ of its maximum on admission, the rest after its first CPU tick)<\/div><div class=\"wrap\"><table id=\"dec\"><\/table><\/div><\/div>\n<div class=\"card\"><h3>Memory management <span id=\"memp\" class=\"pill in\"><\/span><\/h3><div class=\"mem\" id=\"mem\"><\/div><div class=\"g g5\" id=\"mst\"><\/div><div class=\"wrap\" style=\"margin-top:10px\"><table id=\"mt\"><\/table><\/div><\/div>\n<div class=\"g g2\"><div class=\"card\"><h3>Customer notifications <span class=\"pill in\" id=\"nc\"><\/span><\/h3><div class=\"log\" id=\"notes\"><\/div><\/div><div class=\"card\"><h3>System event log<\/h3><div class=\"log\" id=\"log\"><\/div><\/div><\/div>\n\n<script>\nconst $=i=>document.getElementById(i),TOT=[5,3,4],MEM=800,FIX=[100,150,250,300],COL=['#7b96d4','#6cc29a','#e3b45f','#b196dc','#e082a4','#6cc3d4','#d99a6c','#a3c46a'],ST=['Payment','Inventory','Invoice','Packing'],LC=['Received','Queued','Confirmed','Payment','Inventory','Invoice','Packed','Dispatched'];\nconst EX=[[4,2,200,[2,1,1]],[6,1,300,[3,2,2]],[5,3,150,[1,1,2]],[8,2,250,[2,2,1]],[4,1,120,[1,1,1]]];\nlet S,timer=null,rnd=n=>Math.floor(Math.random()*n);\nconst active=()=>S.pend.length||S.q.length||S.rdy.length||S.blk.length;\nfunction init(){S={t:0,orders:[],pend:[],q:[],rdy:[],blk:[],cur:null,ql:0,gantt:[],prod:0,cons:0,log:[],notes:[],dec:[],nid:1001,ptx:'',ctx:'',dm:'Scheduler idle.',lc:''};initMem()}\nfunction initMem(){if(S.t>0)return;let a=0;S.fixed=$('mp').value==='fix';S.blocks=S.fixed?FIX.map(s=>{const b={a,s,o:null};a+=s;return b}):[{a:0,s:MEM,o:null}]}\nfunction log(m){S.log.unshift({t:S.t,m})}\nfunction note(o,tag,m){S.notes.unshift({id:o.id,tag,m,t:S.t})}\nfunction add(b,p,m,x){const id=S.nid++,o={id,col:COL[(id-1001)%COL.length],burst:b,prio:p,mem:m,max:x,hold:[0,0,0],done:0,st:'pending',adm:false,at:null,ft:null,ct:null,rest:false,why:'Awaiting intake'};S.orders.push(o);S.pend.push(o);log(`Intake: ORD-${id} placed (burst ${b}, prio ${p}, mem ${m}, max [${x}]).`);note(o,'received','Order received');return o}\nfunction addEx(){add(2+rnd(7),1+rnd(3),50*(2+rnd(5)),[1+rnd(3),1+rnd(2),1+rnd(2)]);render()}\nfunction loadEx(){EX.forEach(e=>add(e[0],e[1],e[2],e[3]));render()}\nfunction addBad(){add(3,1,900,[6,4,5]);render()}\nfunction addCust(){const v=i=>Math.max(0,parseInt($(i).value)||0);add(Math.max(1,v('cb')),Math.max(1,v('cp')),Math.max(1,v('cm')),[v('c0'),v('c1'),v('c2')]);render()}\nfunction reset(){stop();init();render()}\nfunction spd(){$('spv').textContent=$('sp').value+'×';if(timer){stop();go()}}\nfunction go(){timer=setInterval(()=>{if(!step())stop()},1000/$('sp
